# =============================================================================
# VaultHub —— Gitea Actions 校验流水线（Gitea 原生版，纯 shell，零外部 action）
#
# 三条设计前提：
#   1. 不依赖 github.com 上的任何 action。内网 runner 拉不到外网，
#      原版里的 actions/checkout@v4、actions/setup-go@v5 只会让任务卡死；
#      而 Gitea 本来就会先把仓库克隆到工作目录，checkout 是多余的。
#   2. 工具能缺能少，但绝不静默通过：镜像里没有的 go / gcc / docker
#      一律打印「跳过：镜像里没有 X」，哪一项没跑一眼能看见。
#   2b.（v0.9.94）本流水线不做前端测试：validate 只做「静态校验 + 构建推送」，
#      前端/行为测试套件（tests/test_*.py、tests/v09*_behavior.js）在发布流程内
#      于 Hermes 侧跑完再发（100+ 个文件，需要 python3/ffmpeg/go 等 runner 里
#      没有的工具）。旧实现留了一步「没有 python3 就跳过」的测试步骤，既不真跑
#      又容易被读成绿灯，已删除。
#   3. 不硬编码任何主机名或 IP，只用 Gitea 一定会注入的环境变量。
#
# 实际镜像由 act_runner 的 GITEA_RUNNER_LABELS 决定：
#   ubuntu-latest:docker://node:16-bullseye        有 bash/git/node/gcc/make
#   ubuntu-latest:docker://catthehacker/ubuntu:act-latest   还多 go + python3（体积大）
#
# GitHub 原版已整体注释保留在本文件末尾，并另存为
# .github/workflows/validate.yml.disabled（改名回 .yml 即可恢复）。
# =============================================================================
name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          # 实测：act_runner 交下来的工作目录是空的（连 .git 都没有），因此所有读文件的
          # 步骤都会在第 1~2 步就退出，看起来像校验逻辑写错了，其实是没代码可校验。
          # actions/checkout@v4 在内网 runner 上拉不到 github.com，所以这里用纯 git 克隆。
          if [ -f index.html ] && [ -d scripts ]; then echo "工作区已有代码，无需克隆"; exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"
          SLUG="${GITHUB_REPOSITORY:-}"
          REF="${GITHUB_REF:-refs/heads/main}"
          if [ -z "$BASE" ] || [ -z "$SLUG" ]; then
            echo "::error title=缺少仓库地址::GITHUB_SERVER_URL / GITHUB_REPOSITORY 没注入，无法自行克隆"
            exit 1
          fi
          echo "自行克隆 $BASE/$SLUG.git  引用 $REF"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          if [ -n "${GITEA_CLONE_TOKEN:-}" ]; then
            git config --global url."https://${GITEA_CLONE_TOKEN}@${BASE#https://}/".insteadOf "${BASE}/"
          fi
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
          echo "克隆完成：$(git rev-parse --short HEAD)"
          ls -a | head -20
      - name: 环境自检
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          echo "工作目录：$(pwd)"
          echo "提交：$(git rev-parse --short HEAD 2>/dev/null || echo '?')"
          for t in sh bash git node gcc make go docker curl; do
            if command -v "$t" >/dev/null 2>&1; then echo "  有  $t"; else echo "  缺  $t"; fi
          done

      - name: 检查 shell 脚本语法
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if [ ! -d scripts ]; then echo "没有 scripts 目录"; exit 1; fi
          n=0
          for f in scripts/*.sh; do sh -n "$f"; echo "  ok $f"; n=$((n+1)); done
          echo "共检查 $n 个 shell 脚本"

      - name: 检查 JavaScript 语法
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if ! command -v node >/dev/null 2>&1; then echo "跳过：镜像里没有 node"; exit 0; fi
          for f in web/js/*.js web/vendor/ffmpeg/*.js; do node --check "$f"; echo "  ok $f"; done
          cat > /tmp/extract_inline.js <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
          let m;
          const parts = [];
          while ((m = re.exec(html))) { if (m[1].trim()) parts.push(m[1]); }
          fs.writeFileSync('/tmp/vaulthub-inline.js', parts.join('\n;\n'));
          console.log('  index.html 内联脚本 ' + parts.length + ' 段');
          JS
          node /tmp/extract_inline.js
          if [ -s /tmp/vaulthub-inline.js ]; then node --check /tmp/vaulthub-inline.js; echo "  ok index.html 内联脚本"; fi

      - name: 检查 Go 服务
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if ! command -v go >/dev/null 2>&1; then echo "跳过：镜像里没有 go，go test/vet/build 未执行"; exit 0; fi
          for d in manager media-go subtitle-api; do
            if [ -f "$d/go.mod" ]; then
              echo "--- $d ---"
              ( cd "$d" && go test ./... && go vet ./... && go build ./... )
            fi
          done

      - name: 检查遗留 C 源码
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if ! command -v gcc >/dev/null 2>&1; then echo "跳过：镜像里没有 gcc"; exit 0; fi
          gcc -Wall -Wextra -Werror -fsyntax-only vaulthub-manager.c
          gcc -Wall -Wextra -Werror -pthread -fsyntax-only tests/fixtures/media-api_legacy.c
          echo "  ok C 源码语法"

      - name: 校验 Compose 与 Caddyfile
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if command -v docker >/dev/null 2>&1; then
            cp .env.example .env 2>/dev/null || true
            docker compose config >/dev/null && echo "  ok docker-compose.yml"
          else
            echo "跳过：镜像里没有 docker CLI，docker-compose.yml 未校验"
          fi
          if [ -x ./caddy ]; then
            ./caddy validate --config Caddyfile --adapter caddyfile && echo "  ok Caddyfile"
          else
            echo "跳过：./caddy 不可执行，Caddyfile 未校验"
          fi

      - name: 小结
        run: |
          echo "校验流程结束。上面每一条「跳过：…」都代表该项没在这个 runner 上真正执行。"
          echo "本流水线只做静态校验（shell/JS/Go/C/compose/Caddy），不做前端测试。"
          echo "前端与行为测试套件在发布流程内跑（Hermes 侧：python3 tests/*.py + node tests/*_behavior.js），"
          echo "全绿后才打 tag 发版。要让 go test 也在这里真跑，把 runner 标签指向带 go 的镜像即可。"

