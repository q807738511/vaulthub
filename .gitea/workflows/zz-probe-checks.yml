# 临时自检（第三版）：只盯这 10 个重点用例，逐个 job 公开报状态，验完即删。
name: zz-probe-checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_v0975_movie_detail_behavior.py
          - test_v0976_movie_rating_rec_uimode_behavior.py
          - test_v0986_behavior.py
          - test_v0987_behavior.py
          - test_v0988_behavior.py
          - test_v0989_behavior.py
          - test_media_index.py
          - test_movie_media_backend.py
          - test_compat_audio_backend.py
          - test_manager_caddy_migration.py
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then echo "工作区已有代码，无需克隆"; exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD

      - name: 跑 ${{ matrix.file }}
        run: |
          set -eu
          rc=0
          python3 "tests/${{ matrix.file }}" >/tmp/one.log 2>&1 || rc=$?
          echo "=== ${{ matrix.file }} 退出码 $rc ==="
          tail -10 /tmp/one.log
          exit $rc
