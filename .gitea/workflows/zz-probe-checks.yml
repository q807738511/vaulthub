# =============================================================================
# 临时自检（第二版）：把 tests/ 下每个用例文件都拆成一个 job，逐个公开报状态。
# 公开接口会列出每个 job 的结论（context 形如
#   zz-probe-checks / check (test_xxx.py) (push)），于是「CI 镜像里到底哪些用例不过」
# 无需登录、无需令牌就能看全。探完即删。
# =============================================================================
