# =============================================================================
# 临时自检：把这些「需要外部程序」的测试文件逐个跑一遍，每个一个 job。
#
# 目的：job 日志要登录才能看，而公开的
#   GET /api/v1/repos/{owner}/{repo}/commits/{sha}/status
# 会列出每个 job 的结论，矩阵展开后 context 形如
#   zz-probe-checks / check (test_xxx.py) (push)
# 于是「哪个测试文件在 runner 的镜像里跑不过」一眼可见。
#
# 探完即删。
# =============================================================================
name: zz-probe-checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test_compat_audio_backend.py
          - test_gpu_and_long_text_reader.py
          - test_manager_caddy_migration.py
          - test_media_formats_and_movie.py
          - test_nvidia_ffmpeg_runtime.py
          - test_phase2_go_media_and_auth.py
          - test_v086_asset_cache_busting.py
          - test_v0970_release_step_logic.py
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then echo "工作区已有代码，无需克隆"; exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
          echo "克隆完成：$(git rev-parse --short HEAD)"

      - name: 跑 ${{ matrix.file }}
        run: |
          set -eu
          echo "=== 目标：${{ matrix.file }} ==="
          echo "--- python3 / 镜像里有没有这些程序 ---"
          python3 --version
          for t in ffmpeg ffprobe go zip unzip gh jq node gcc git; do
            if command -v "$t" >/dev/null 2>&1; then echo "  有  $t"; else echo "  缺  $t"; fi
          done
          echo "--- 开始跑用例 ---"
          rc=0
          python3 "tests/${{ matrix.file }}" >/tmp/one.log 2>&1 || rc=$?
          echo "--- 退出码 $rc ---"
          tail -25 /tmp/one.log
          exit $rc
