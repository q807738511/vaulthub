# 临时自检（第五版）：两个工作流的每一步各一个 job，用公开的提交状态接口逐步定位。验完即删。
name: zz-probe-steps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  v1:
    name: "准备工作区（自行克隆）"
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
      - name: "准备工作区（自行克隆）"
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          # 实测：act_runner 交下来的工作目录是空的（连 .git 都没有），因此所有读文件的
          # 步骤都会在第 1~2 步就退出，看起来像校验逻辑写错了，其实是没代码可校验。
          # actions/checkout@v4 在内网 runner 上拉不到 github.com，所以这里用纯 git 克隆。
          if [ -f index.html ] && [ -d scripts ]; then echo "工作区已有代码，无需克隆"; exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"
          SLUG="${GITHUB_REPOSITORY:-}"
          REF="${GITHUB_REF:-refs/heads/main}"
          if [ -z "$BASE" ] || [ -z "$SLUG" ]; then
            echo "::error title=缺少仓库地址::GITHUB_SERVER_URL / GITHUB_REPOSITORY 没注入，无法自行克隆"
            exit 1
          fi
          echo "自行克隆 $BASE/$SLUG.git  引用 $REF"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          if [ -n "${GITEA_CLONE_TOKEN:-}" ]; then
            git config --global url."https://${GITEA_CLONE_TOKEN}@${BASE#https://}/".insteadOf "${BASE}/"
          fi
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
          echo "克隆完成：$(git rev-parse --short HEAD)"
          ls -a | head -20

  v2:
    name: "环境自检"
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
      - name: "环境自检"
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          echo "工作目录：$(pwd)"
          echo "提交：$(git rev-parse --short HEAD 2>/dev/null || echo '?')"
          for t in sh bash git node gcc make go python3 docker curl; do
            if command -v "$t" >/dev/null 2>&1; then echo "  有  $t"; else echo "  缺  $t"; fi
          done

  v3:
    name: "检查 shell 脚本语法"
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
      - name: "检查 shell 脚本语法"
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if [ ! -d scripts ]; then echo "没有 scripts 目录"; exit 1; fi
          n=0
          for f in scripts/*.sh; do sh -n "$f"; echo "  ok $f"; n=$((n+1)); done
          echo "共检查 $n 个 shell 脚本"

  v4:
    name: "检查 JavaScript 语法"
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          if [ -f index.html ] && [ -d scripts ]; then exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"; SLUG="${GITHUB_REPOSITORY:-}"; REF="${GITHUB_REF:-refs/heads/main}"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
      - name: "检查 JavaScript 语法"
        run: |
          set -eu
          # Gitea/act 用 bash -eo pipefail 执行 run 块；本脚本是按 set -eu 语义写的，
          # 这里显式关掉 pipefail：否则「... | head -1」这类管道会因 head 提前退出（SIGPIPE）
          # 或 grep 无匹配而被判成步骤失败——之前 CI 的 1~2 秒红灯就是这个。
          if [ -n "${BASH_VERSION:-}" ]; then set +o pipefail; fi
          if ! command -v node >/dev/null 2>&1; then echo "跳过：镜像里没有 node"; exit 0; fi
          for f in web/js/*.js web/vendor/ffmpeg/*.js; do node --check "$f"; echo "  ok $f"; done
          cat > /tmp/extract_inline.js <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
          let m;
          const parts = [];
          while ((m = re.exec(html))) { if (m[1].trim()) parts.push(m[1]); }
          fs.writeFileSync('/tmp/vaulthub-inline.js', parts.join('\n;\n'));
          console.log('  index.html 内联脚本 ' + parts.length + ' 段');
          JS
          node /tmp/extract_inline.js
          if [ -s /tmp/vaulthub-inline.js ]; then node --check /tmp/vaulthub-inline.js; echo "  ok index.html 内联脚本"; fi

  v5:
    name: "检查 Go 服务"
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
