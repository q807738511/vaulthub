# =============================================================================
# VaultHub —— Gitea Actions 构建 / 发布流水线（Gitea 原生版，纯 shell，零外部 action）
#
# 与原 GitHub 版的对应关系：
#   原版                            本版
#   actions/checkout@v4        →   不需要，Gitea 已把仓库克隆到工作目录
#   docker/setup-buildx-action →   不需要，直接用本机 docker CLI
#   docker/login-action        →   docker login --password-stdin
#   docker/metadata-action     →   手写 tag 规则（下面「确定镜像标签」一步）
#   docker/build-push-action   →   docker build / docker push
#   gh release create          →   scripts/ci-release-gitea.sh（Gitea OpenAPI，幂等+重试+读回）
#
# 触发：main 推送 → 只推 sha-<短提交>；tag 推送（v* 或 数字开头）→ 额外推 latest 和该 tag。
#
# 关于构建环境（重要）：
#   job 跑在 act_runner 给的容器里，容器里不一定有 docker CLI，也不一定有 docker socket。
#   所以「构建并推送」这一步会先探测：
#     有 docker           → 真的 build + push + 读回 digest
#     没有 docker         → 打印 ::warning:: 并给出 NAS 上的命令，然后跳过（不亮假绿灯）
#   想让 CI 自己构建，需要在 act_runner 的 config.yaml 里给 job 容器挂 socket：
#     container:
#       options: "-v /var/run/docker.sock:/var/run/docker.sock"
#   并且把标签指向自带 docker CLI 的镜像。否则请继续用 NAS 侧脚本。
#
# 需要的仓库密钥（缺了就跳过对应步骤，并在日志里明说）：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN     推 Docker Hub
#   GITEA_RELEASE_TOKEN                      在 Gitea 上创建 Release（仓库级访问令牌）
#
# GitHub 原版已整体注释保留在本文件末尾，并另存为
# .github/workflows/publish-image.yml.disabled（改名回 .yml 即可恢复）。
# =============================================================================
name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 环境与身份自检
        run: |
          set -eu
          echo "工作目录：$(pwd)"
          echo "GITHUB_REF        = ${GITHUB_REF:-<未设置>}"
          echo "GITHUB_REF_NAME   = ${GITHUB_REF_NAME:-<未设置>}"
          echo "GITHUB_SHA        = ${GITHUB_SHA:-<未设置>}"
          echo "GITHUB_REPOSITORY = ${GITHUB_REPOSITORY:-<未设置>}"
          echo "GITHUB_SERVER_URL = ${GITHUB_SERVER_URL:-<未设置>}"
          for t in sh git node gcc make go python3 docker curl; do
            if command -v "$t" >/dev/null 2>&1; then echo "  有  $t"; else echo "  缺  $t"; fi
          done
          if [ -S /var/run/docker.sock ]; then echo "  docker socket：可用"; else echo "  docker socket：不可用"; fi

      - name: 版本一致性校验
        run: |
          set -eu
          V_HTML=$(sed -n 's/.*VAULTHUB_ASSET_VERSION *= *"\([^"]*\)".*/\1/p' index.html | head -1)
          V_JS=$(sed -n 's/.*VAULTHUB_SCRIPT_VERSION *= *"\([^"]*\)".*/\1/p' web/js/01-state.js | head -1)

          # tag 名必须有兜底：Gitea 不保证注入 GITHUB_REF_NAME。
          # 之前只认 GITHUB_REF_NAME，它一旦缺失，tag 名就成了空串，
          # 「tag 与版本号不符」会把每一次 tag 发版都拦在这一步（1 秒红灯）。
          REF_FULL="${GITHUB_REF:-}"
          TAG_FROM_REF=""
          case "$REF_FULL" in
            refs/tags/*) TAG_FROM_REF="${REF_FULL#refs/tags/}" ;;
          esac
          TAG_NAME="${GITHUB_REF_NAME:-}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="$TAG_FROM_REF"; fi

          echo "index.html 资源版本 = ${V_HTML:-<读不到>}"
          echo "01-state.js 脚本版本 = ${V_JS:-<读不到>}"
          echo "GITHUB_REF       = ${REF_FULL:-<未注入>}"
          echo "GITHUB_REF_NAME  = ${GITHUB_REF_NAME:-<未注入>}"
          echo "推导出的 tag 名   = ${TAG_NAME:-<空>}"

          if [ -z "$V_HTML" ] || [ -z "$V_JS" ]; then echo "::error title=版本号读不到::index.html / 01-state.js 里的版本常量没解析出来"; exit 1; fi
          if [ "$V_HTML" != "$V_JS" ]; then echo "::error title=版本号不一致::index.html=$V_HTML 与 01-state.js=$V_JS 必须相同"; exit 1; fi
          echo "VERSION=$V_HTML" > /tmp/vh-version.env

          case "$REF_FULL" in
            refs/tags/*)
              TAG="$TAG_NAME"
              if [ -z "$TAG" ]; then
                echo "::error title=拿不到 tag 名::GITHUB_REF=$REF_FULL，但 GITHUB_REF_NAME 没注入、也推导不出 tag 名。这是 CI 环境问题，不是版本号问题——把上面几行贴回来即可定位"
                exit 1
              fi
              WANT="${TAG#v}"
              echo "这是一个 tag 构建：$TAG（期望版本 $WANT）"
              if [ "$WANT" != "$V_HTML" ]; then
                echo "::error title=tag 与版本号不符::tag=$TAG 对应版本 $WANT，但代码里是 $V_HTML；请先改版本号再打 tag"
                exit 1
              fi
              echo "TAG=$TAG" >> /tmp/vh-version.env
              ;;
            *)
              echo "这是分支推送（${TAG_NAME:-?}）：不做 tag 与版本号的绑定校验"
              ;;
          esac
      - name: 发布说明文件检查
        run: |
          set -eu
          . /tmp/vh-version.env
          NOTES=".github/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$NOTES" ]; then
            N=$(wc -c < "$NOTES" | tr -d ' ')
            echo "发布说明：$NOTES（$N 字节）"
            if [ "${TAG:-}" != "" ] && [ "$N" -lt 500 ]; then
              echo "::error title=发布说明过短::$NOTES 只有 $N 字节，小于 500，几乎可以断定文件不对"; exit 1
            fi
          else
            if [ "${TAG:-}" != "" ]; then
              echo "::error title=缺少发布说明::找不到 $NOTES，拒绝为 $TAG 发布"; exit 1
            fi
            echo "::warning title=暂无发布说明::分支推送，未找到 $NOTES（正式发版前必须补上）"
          fi

      - name: 前端测试套件
        run: |
          set -eu
          if ! command -v python3 >/dev/null 2>&1; then echo "跳过：镜像里没有 python3，测试套件未执行"; exit 0; fi
          pass=0; fail=0; failed=""
          for f in tests/test_*.py; do
            if python3 "$f" >/tmp/t.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); failed="$failed $f"; fi
          done
          echo "测试套件：通过 $pass 个，失败 $fail 个"
          if [ "$fail" -ne 0 ]; then echo "失败用例：$failed"; tail -40 /tmp/t.log; exit 1; fi

      - name: 构建并推送镜像到 Docker Hub
        env:
          IMAGE_NAME: docker.io/q807738511/vaulthub
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          . /tmp/vh-version.env
          SHORT=$(git rev-parse --short HEAD)
          # 标签规则与原 docker/metadata-action 一致：
          #   分支推送 → 只产生 sha-<短提交>
          #   tag 推送 → 额外产生该 tag 和 latest（latest 与版本 tag 指向同一 digest）
          REFS="$IMAGE_NAME:sha-$SHORT"
          if [ "${TAG:-}" != "" ]; then REFS="$REFS $IMAGE_NAME:$TAG $IMAGE_NAME:latest"; fi
          BUILD_ARGS=""
          for r in $REFS; do BUILD_ARGS="$BUILD_ARGS -t $r"; done

          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning title=本次未构建镜像::runner 的 job 容器里没有 docker CLI，已跳过构建与推送"
            echo "本次本应产生的标签：$REFS"
            echo "请在能构建的机器（NAS）上执行： sh scripts/release-nas.sh ${TAG:-<tag>}"
            echo "SKIPPED" > /tmp/vh-build-status
            exit 0
          fi
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error title=缺少 Docker Hub 凭据::请在仓库设置里配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
          docker build $BUILD_ARGS -f Dockerfile .

          echo "--- 逐个推送 ---"
          for r in $REFS; do
            echo "push $r"
            docker push "$r"
          done

          echo "--- 推完读回 digest（不信任 push 的退出码）---"
          for r in $REFS; do
            DIG=$(docker buildx imagetools inspect "$r" 2>/dev/null | sed -n 's/^Digest: *//p' | head -1)
            if [ -z "$DIG" ]; then echo "::error title=读回失败::$r 推完读不到 digest"; exit 1; fi
            echo "  $r -> $DIG"
          done
          echo "BUILT" > /tmp/vh-build-status

      - name: 在 Gitea 上创建 / 更新 Release
        env:
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN }}
        run: |
          set -eu
          . /tmp/vh-version.env
          if [ "${TAG:-}" = "" ]; then echo "分支推送，不创建 Release"; exit 0; fi
          if [ -z "${GITEA_RELEASE_TOKEN:-}" ]; then
            echo "::warning title=跳过 Release::没有配置 GITEA_RELEASE_TOKEN 仓库密钥，未在 Gitea 上创建 Release"
            exit 0
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning title=跳过 Release::镜像里没有 python3，Release 说明的 JSON 转义做不了"; exit 0
          fi
          GITEA_TOKEN="$GITEA_RELEASE_TOKEN" \
          GITEA_API_BASE="${GITHUB_SERVER_URL:-}/api/v1" \
          GITEA_REPO_SLUG="${GITHUB_REPOSITORY:-}" \
            sh scripts/ci-release-gitea.sh "$TAG" ".github/RELEASE_NOTES_${VERSION}.md"

      - name: 小结
        run: |
          echo "======== 本次流水线小结 ========"
          if [ -f /tmp/vh-build-status ] && [ "$(cat /tmp/vh-build-status)" = "BUILT" ]; then
            echo "镜像：已构建并推送，digest 见上一步读回结果"
          else
            echo "镜像：未构建（本 runner 没有 docker）。请在 NAS 上执行 scripts/release-nas.sh"
          fi
          echo "Gitea Release：见上一步日志（未配置令牌或非 tag 构建时会明确跳过）"
          echo "================================"

