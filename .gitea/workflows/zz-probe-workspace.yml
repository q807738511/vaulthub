# =============================================================================
# 临时探测：Gitea job 的工作区里到底有什么内容。
#
# 为什么用「时长编码」：job 日志要登录才能看（/actions/runs/N/jobs/0/logs → 404），
# 但运行列表里的耗时是公开的。所以把结论编进 sleep 秒数，探完立即删除本文件。
#
#   K=0 空工作区（连 .git 都没有）      → 约 6s
#   K=1 只有 .git，没有工作树文件        → 约 10s
#   K=2 有 .git 和 index.html            → 约 14s
#   K=3 完整工作树（.git + index.html + scripts/ + web/js/01-state.js） → 约 18s 且判绿
#
# 只要 K<3 就判红，避免「工作区是空的却显示绿色」。
# =============================================================================
name: zz-probe-workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作区（自行克隆）
        run: |
          set -eu
          # 实测：act_runner 交下来的工作目录是空的（连 .git 都没有），因此所有读文件的
          # 步骤都会在第 1~2 步就退出，看起来像校验逻辑写错了，其实是没代码可校验。
          # actions/checkout@v4 在内网 runner 上拉不到 github.com，所以这里用纯 git 克隆。
          if [ -f index.html ] && [ -d scripts ]; then echo "工作区已有代码，无需克隆"; exit 0; fi
          BASE="${GITHUB_SERVER_URL:-}"
          SLUG="${GITHUB_REPOSITORY:-}"
          REF="${GITHUB_REF:-refs/heads/main}"
          if [ -z "$BASE" ] || [ -z "$SLUG" ]; then
            echo "::error title=缺少仓库地址::GITHUB_SERVER_URL / GITHUB_REPOSITORY 没注入，无法自行克隆"
            exit 1
          fi
          echo "自行克隆 $BASE/$SLUG.git  引用 $REF"
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$BASE/$SLUG.git"
          if [ -n "${GITEA_CLONE_TOKEN:-}" ]; then
            git config --global url."https://${GITEA_CLONE_TOKEN}@${BASE#https://}/".insteadOf "${BASE}/"
          fi
          git fetch -q --depth=1 origin "$REF"
          git checkout -q -f FETCH_HEAD
          echo "克隆完成：$(git rev-parse --short HEAD)"
          ls -a | head -20
      - name: 探测工作区内容（结论编进时长）
        run: |
          set -eu
          K=0
          if [ -d .git ]; then K=1; fi
          if [ -f index.html ]; then K=2; fi
          if [ -f index.html ] && [ -d scripts ] && [ -f web/js/01-state.js ]; then K=3; fi

          echo "=== 工作区根目录 ==="
          pwd
          ls -a | head -30
          echo "=== 条目数 $(ls -a | wc -l) ==="
          echo "=== git 状态 ==="
          git rev-parse --short HEAD 2>&1 || echo "（没有 git 仓库）"
          git status --short 2>&1 | head -5 || true
          echo "=== 关键文件 ==="
          for f in index.html scripts web/js/01-state.js docker-compose.yml Caddyfile; do
            if [ -e "$f" ]; then echo "  有  $f"; else echo "  缺  $f"; fi
          done
          echo "K=$K"

          sleep $((6 + 4 * K))
          if [ "$K" -lt 3 ]; then
            echo "::error title=工作区不完整::K=$K，见上面清单"
            exit 1
          fi
          echo "工作区完整"
