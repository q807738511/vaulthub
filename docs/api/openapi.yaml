        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/media/nfo:
    get:
      tags: [scraping]
      summary: 读取 NFO 与本地元数据摘要
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/MediaPath'
