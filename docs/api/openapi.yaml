              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/media/tmdb:
    get:
      tags: [scraping]
      summary: TMDB 代理（搜索/详情/季；服务端代理避免暴露 API Key）
      parameters:
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [movie, series, tv] }
          default: movie
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: TMDB 数字 ID（详情模式）
        - name: season
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 99 }
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: TMDB 原样 JSON 透传
          content:
            application/json:
              schema: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: 上游失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/media/douban:
    get:
      tags: [scraping]
      summary: 豆瓣评分代理（未命中返回 200 + match=false）
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: year
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [series, movie] }
      responses:
        '200':
          description: 匹配结果
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/media/douban/batch:
    post:
      tags: [scraping]
      summary: 批量豆瓣评分（≤24 条）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      year: { type: string }
                      type: { type: string }
      responses:
        '200':
          description: 批量结果
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/media/tvdb:
    get:
      tags: [scraping]
      summary: TVDB 剧集搜索代理
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/media/cast/avatar:
    get:
      tags: [scraping]
      summary: 演员头像（TMDB person 路径代理，或库内 .actors/ 本地头像）
      parameters:
        - name: person
          in: query
          required: false
          schema: { type: string }
          description: TMDB profile 路径（远程模式）
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/MediaPath'
      responses:
        '200':
          description: 头像图片
          content:
            image/*:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/media/metadata:
    get:
      tags: [metadata]
      summary: 单文件本地元数据（NFO + sidecar + override 合并，APP 详情页数据源）
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/MediaPath'
      responses:
        '200':
          description: 元数据（title/genres/cast/poster/subtitles/watched 等，字段见 ROUTE_INVENTORY 2.7）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/media/metadata/batch:
    post:
      tags: [metadata]
      summary: 批量本地元数据（≤500 条；APP 列表页海报墙数据源）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, paths]
              properties:
                id: { type: string }
                paths:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        '200':
          description: '路径 → 元数据 映射'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                    additionalProperties: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/media/metadata/override:
    put:
      tags: [metadata]
      summary: 保存手工覆盖（用户评分/标签/已看状态的多端同步载体）
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/MediaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                year: { type: string, description: 4 位数字 1800-2200 }
                user_rating: { type: number, minimum: 0, maximum: 10 }
                poster: { type: string }
                logo: { type: string }
                fanart: { type: string }
                backdrop: { type: string }
                tags: { type: array, maxItems: 20, items: { type: string } }
                watched: { type: boolean }
      responses:
        '200':
          description: 清洗后的 override 本体
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/media/metadata/artwork:
    get:
      tags: [metadata]
      summary: 媒体目录图片候选（手工选图用）
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/MediaPath'
      responses:
        '200':
          description: 候选图片列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    LibraryId:
      name: id
      in: query
      required: true
      schema: { type: string }
      description: 媒体库 ID
    MediaPath:
      name: path
      in: query
      required: true
      schema: { type: string }
      description: 库内相对路径（正斜杠分隔）
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vh_session
      description: POST /api/login 获得；30/60 天滑动续期；manager 持有并持久化
  responses:
    BadRequest:
      description: 请求参数/JSON 非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error: { type: string, enum: [login required] }
    Forbidden:
      description: 无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MustChange:
      description: must-change 受限会话被拦截
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 库/文件/会话不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MethodNotAllowed:
      description: 方法不允许
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: 冲突（ID 已存在/正在删除等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooMany:
      description: 并发/频率超限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: 语义错误（探测失败/无可读内容等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: 服务端错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerUnavailable:
      description: 组件不可用（poppler 缺失/数据库不可用等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }
    OkEnvelope:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
    LoginRequest:
      type: object
      properties:
        username: { type: string, description: open 模式下忽略 }
        password: { type: string }
        keep_days:
          type: integer
          description: '保持登录天数：>=60 归 60，其余归 30'
    LoginResponse:
      type: object
      properties:
        ok: { type: boolean }
        idle_timeout_seconds: { type: integer, example: 2592000 }
        session_days: { type: integer, enum: [30, 60] }
        must_change: { type: boolean }
    AuthModeResponse:
      type: object
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [password, open] }
        username: { type: string }
        has_password: { type: boolean }
        must_change: { type: boolean }
        session_default_days: { type: integer, example: 30 }
        session_long_days: { type: integer, example: 60 }
    AccountRequest:
      type: object
      properties:
        old_password: { type: string, description: 有密码凭据且非受限会话时必填 }
        username: { type: string }
        password:
          type: string
          description: '新密码规则：≥8 位、字母+数字、不在弱口令黑名单、不含用户名'
        mode: { type: string, enum: ['', password, open] }
    Library:
      type: object
      required: [id, name, type, path]
      properties:
        id:
          type: string
          maxLength: 63
          pattern: '^[a-zA-Z0-9\-_.]+$'
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [audio, musicvideo, comic, book, movie, series] }
        path: { type: string, description: 已存在的绝对目录 }
        paths: { type: array, items: { type: string } }
    FileEntry:
      type: object
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        mtime: { type: integer, format: int64 }
    FilesResponse:
      type: object
      properties:
        status: { type: string, enum: [ready, indexing] }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
        files: { type: array, items: { $ref: '#/components/schemas/FileEntry' } }
        version: { type: string, description: 索引指纹（扫描中不下发） }
        query: { type: string }
        scanning: { type: boolean }
    PlaybackClient:
      type: object
      description: 客户端解码/封装能力上报（原生 APP 可扩展 av1/dts/truehd 等字段，服务端未知字段按 false）
      properties:
        mp4: { type: boolean }
        mse: { type: boolean }
        h264: { type: boolean }
        hevc: { type: boolean }
        vp9: { type: boolean }
        aac: { type: boolean }
        opus: { type: boolean }
    PlaybackPlanRequest:
      type: object
      required: [library_id, path]
      properties:
        library_id: { type: string }
        path: { type: string }
        quality:
          type: string
          enum: ['', auto, original, 1080p, 720p, 480p]
          description: 大小写不敏感；显式画质在源高超限或未知时强制 full_transcode
        hardware: { type: string, enum: [auto, cpu, vaapi, qsv, cuda] }
        server_transcode:
          type: string
          description: 'off = 禁用服务端转码（客户端本地解码）；原盘镜像会返回 409'
        network_bps:
          type: integer
          format: int64
          description: 'auto 档限高：<2Mbps→480p <6Mbps→720p <16Mbps→1080p ≥16Mbps 不限'
        client: { $ref: '#/components/schemas/PlaybackClient' }
    PlaybackMedia:
      type: object
      properties:
        container: { type: string }
        video_codec: { type: string }
        audio_codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        bit_rate: { type: string }
        duration: { type: string }
    PlaybackPlan:
      type: object
      properties:
        layer: { type: string, enum: [direct_play, smart_stream] }
        mode: { type: string, enum: [direct, remux, audio_transcode, full_transcode] }
        reason: { type: string, description: 中文可读决策原因 }
        url: { type: string, description: 可直接使用的播放 URL }
        video_action: { type: string, enum: [copy, h264] }
        audio_action: { type: string, enum: [copy, aac] }
        hardware: { type: string, enum: [cpu, vaapi, qsv, cuda, client] }
        max_height: { type: integer, description: 0/缺省 = 不限 }
        disc: { type: string, enum: [bluray, dvd] }
        media: { $ref: '#/components/schemas/PlaybackMedia' }
        warn: { type: string }
    PlaybackSession:
      type: object
      properties:
        id: { type: string, description: 服务端生成的 32 位 hex }
        library_id: { type: string }
        path: { type: string }
        mode: { type: string }
        state: { type: string, example: playing }
        position_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64, description: Unix 毫秒 }
    ProgressRequest:
      type: object
      properties:
        position_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        state: { type: string }
    HardwareInfo:
      type: object
      properties:
        configured: { type: string }
        selected: { type: string, enum: [cpu, vaapi, qsv, cuda] }
        available:
          type: object
          properties:
            cpu: { type: boolean }
            vaapi: { type: boolean }
            qsv: { type: boolean }
            cuda: { type: boolean }
        vaapi_device: { type: string }
        nvidia_device: { type: boolean }
        encoders: { type: array, items: { type: string } }
        ffmpeg: { type: boolean }
        cores: { type: integer }
        software_only: { type: boolean }
        weak_cpu: { type: boolean }
    ProbeResponse:
      type: object
      description: ffprobe 失败时也返回 200（字段为空 + compat_recommended=true）
      properties:
        audio_codec: { type: string }
        video_codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        format_name: { type: string }
        container: { type: string }
        bit_rate: { type: string }
        duration: { type: string }
        container_likely_supported: { type: boolean }
        audio_likely_supported: { type: boolean }
        compat_recommended: { type: boolean }
        disc_input: { type: string, enum: [plain, bluray, dvd] }
        disc: { type: boolean }
    ArchiveEntry:
      type: object
      properties:
        name: { type: string, description: 解码展示名 }
        raw: { type: string, description: ZIP 原始条目名（翻页时传这个） }
        size: { type: integer, format: int64 }
        url: { type: string, description: 单页图片 URL }
    ArchiveListResponse:
      type: object
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/ArchiveEntry' } }
        total: { type: integer }
    EpubResponse:
      type: object
      properties:
        title: { type: string }
        chapters:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              text: { type: string }
        count: { type: integer }
        bytes: { type: integer }
        truncated: { type: boolean }
    ReadingProgressEntry:
      type: object
      properties:
        progress: { type: number, minimum: 0, maximum: 100 }
        page: { type: integer, minimum: 0, maximum: 100000 }
        total: { type: integer, minimum: 0, maximum: 100000 }
        updated_at: { type: integer, format: int64, description: Unix 秒 }
    ReadingProgressWrite:
      type: object
      required: [progress]
      properties:
        progress: { type: number, minimum: 0, maximum: 100 }
        page: { type: integer, minimum: 0, maximum: 100000 }
        total: { type: integer, minimum: 0, maximum: 100000 }
    ReadingProgressResponse:
      type: object
      properties:
        id: { type: string }
        items:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ReadingProgressEntry' }
    PlaybackProgressEntry:
      type: object
      properties:
        position_ms: { type: integer, format: int64, description: 已播位置（毫秒） }
        duration_ms: { type: integer, format: int64, description: 总时长（毫秒，0=未知） }
        completed: { type: boolean, description: 是否看完（position≥95% 或显式标记） }
        updated_at: { type: integer, format: int64, description: Unix 秒 }
    PlaybackProgressWrite:
      type: object
      required: [position_ms]
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        completed: { type: boolean }
    PlaybackProgressResponse:
      type: object
      properties:
        id: { type: string }
        items:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PlaybackProgressEntry' }
    SubtitleSearchResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SubtitleItem' } }
        count: { type: integer }
        providers: { type: array, items: { type: string } }
    SubtitleItem:
      type: object
      properties:
        label: { type: string }
        url: { type: string, description: 内嵌文本轨指向 extract；本地指向 proxy；在线源指向 download }
        provider: { type: string }
        language: { type: string }
        format: { type: string }
        kind: { type: string, enum: [text, bitmap] }
        text: { type: boolean }
        burn_in: { type: boolean }
        burn_track: { type: integer, description: 图形字幕烧录轨号（喂给 compat 的 sub_track） }
        index: { type: integer, description: 字幕轨序号（0 起） }
    StreamsResponse:
      type: object
      properties:
        audio_tracks:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              stream_index: { type: integer }
              label: { type: string }
        subtitle_tracks:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              label: { type: string }
              codec: { type: string }
              language: { type: string }
              kind: { type: string, enum: [text, bitmap] }
              text: { type: boolean }
              burn_in: { type: boolean }
              stream_index: { type: integer }
              url: { type: string, description: 仅文本轨，WebVTT 提取地址 }
              burn_track: { type: integer, description: 仅图形轨 }
