        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 写入结果（written/kept/skipped/merged/conflicts）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/media/series/plan:
    get:
      tags: [scraping]
