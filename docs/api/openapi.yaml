              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [scraping]
      summary: 写入刮削结果缓存
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 写入统计
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [scraping]
      summary: 清空刮削缓存
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
