# 自动更新部署配置
# 1. 将 <github用户名> 替换为你的 GitHub 用户名（必须全小写）。
# 2. cp .env.example .env 并修改配置。
# 3. docker compose -f docker-compose.autoupdate.yml up -d

services:
  vaulthub:
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always
    ports:
      - "${WEBUI_PORT:-8088}:8088"
    environment:
      NAS_IP: "${NAS_IP:-192.168.112.3}"
      DASHBOARD_ORIGIN: "${DASHBOARD_ORIGIN:-https://home.enged.top}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      WEB_ROOT: /srv
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./data:/data
      - ${MUSIC_PATH:-./media/music}:/media/music:ro
      - ${COMIC_PATH:-./media/comics}:/media/comics:ro
      - ${BOOK_PATH:-./media/books}:/media/books:ro
    read_only: false
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: VaultHub-Watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_ROLLING_RESTART: "true"
    restart: unless-stopped
