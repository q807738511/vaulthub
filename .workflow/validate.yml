# =============================================================================
# VaultHub —— Gitee Go 校验流水线
#
# 对应原来的 .github/workflows/validate.yml（GitHub Actions）。
# 语法基准：Gitee 官方 demo 仓库里真实跑通过的 yml（骨架见 publish.yml 顶部注释）。
#
# ⚠️ 与旧工作流最大的差别：**托管 runner 上不一定有 gcc / node / python3 / docker**。
#    原 GitHub 工作流跑在 ubuntu-latest 上，这些都有；Gitee 的 Golang 插件 runner 上
#    通常只有 go + git + sh。所以本流水线的原则是：
#        「工具在 → 真校验，失败就红；
#          工具不在 → 打印【跳过】并继续，不许因为缺工具而假红。」
#    每一步开头都做工具自检，跑完打印一份【跳过清单】，避免"全绿但啥也没验"。
#    想强制校验的话，用 Gitee 的「主机组」（shell@agent / deploy@agent）把命令下到
#    NAS 上跑 —— NAS 上 gcc/node/python3/docker/caddy 都齐。
#
# ⚠️ 构建分钟：免费额度 = 单仓库 200 分钟（一次性）+ 每月 500 分钟。
#    本流水线跑一次大约 2~4 分钟（go test + build）。如果你只想在打 tag 时校验，
#    把下面的 triggers 改成 tags: {prefix: [v]} 即可。
# =============================================================================
version: '1.0'
name: validate
displayName: 校验（shell / Go / JS / Caddy / Compose）

triggers:
  # 开启自动触发（对应旧工作流的 on:）
  trigger: auto
  # 与原 validate.yml 一致：push 与 pull_request 都触发，分支不限
  push:
    branches:
      # 空前缀 = 匹配所有分支
      prefix:
        - ''
  pr:
    # 与原 validate.yml 的 pull_request 一致：所有 PR 都触发。
    # 显式写空前缀（官方 demo 用空前缀表示"匹配全部"），
    # 不用空的 `pr: {}`，避免方言歧义。
    branches:
      prefix:
        - ''

stages:
  - name: validate
    displayName: 校验
    # 官方 demo 里出现过的取值
    strategy: naturally
    trigger: auto
    steps:
      - step: build@golang
        name: validate_all
        displayName: 全量校验
        golangVersion: '1.23'
        commands:
          - |
            set -e
            SKIPPED=""

            echo "================ 0/7 工具自检 ================"
            for t in sh git go gcc node python3 docker curl; do
              printf '  %-10s ' "$t"
              if command -v "$t" >/dev/null 2>&1; then
                "$t" --version 2>&1 | head -1
              else
                echo "【缺失】 → 相关校验项将跳过"
              fi
            done
            printf '  %-10s ' "docker compose"
            if docker compose version >/dev/null 2>&1; then docker compose version | head -1; else echo "【缺失】 → 相关校验项将跳过"; fi
            printf '  %-10s ' "caddy"
            if [ -x ./caddy ]; then ./caddy version 2>&1 | head -1; else echo "【缺失】 → 相关校验项将跳过"; fi

            echo "================ 1/7 shell 脚本语法 ================"
            for f in scripts/install.sh scripts/upgrade.sh scripts/rollback.sh scripts/ci-release.sh scripts/release-nas.sh; do
              [ -f "$f" ] && { sh -n "$f"; echo "  OK: $f"; }
            done

            echo "================ 2/7 Go 服务（manager / media-go / subtitle-api）================"
            for m in manager media-go subtitle-api; do
              echo "  --- $m ---"
              ( cd "$m" && go test ./... && go vet ./... && go build ./... )
            done
            echo "  OK: 三个 Go 模块的测试 / vet / 构建全部通过"

            echo "================ 3/7 遗留 C 源码 ================"
            if command -v gcc >/dev/null 2>&1; then
              gcc -Wall -Wextra -Werror -fsyntax-only vaulthub-manager.c
              gcc -Wall -Wextra -Werror -pthread -fsyntax-only tests/fixtures/media-api_legacy.c
              echo "  OK: C 源码无警告"
            else
              echo "  【跳过】runner 上没有 gcc"
              SKIPPED="$SKIPPED gcc"
            fi

            echo "================ 4/7 前端 JS 语法 ================"
            if command -v node >/dev/null 2>&1; then
              for f in web/js/*.js; do
                node --check "$f"
              done
              echo "  OK: web/js 下 $(ls web/js/*.js | wc -l | tr -d ' ') 个文件语法通过"
            else
              echo "  【跳过】runner 上没有 node"
              SKIPPED="$SKIPPED node"
            fi

            echo "================ 5/7 内联脚本 + 结构守卫 ================"
            if command -v python3 >/dev/null 2>&1; then
              python3 - <<'PY'
            import re
            from pathlib import Path
            html = Path('index.html').read_text(encoding='utf-8')
            scripts = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.S)
            body = '\n;\n'.join(s for s in scripts if s.strip())
            Path('/tmp/vaulthub-inline.js').write_text(body, encoding='utf-8')
            print(f"  内联脚本 {len(scripts)} 段，提取 {len(body)} 字符")
            PY
              if command -v node >/dev/null 2>&1 && [ -s /tmp/vaulthub-inline.js ]; then
                node --check /tmp/vaulthub-inline.js
                echo "  OK: index.html 内联脚本可解析"
              fi
              if [ -f scripts/check-index-structure.py ]; then
                python3 scripts/check-index-structure.py
                echo "  OK: index.html 结构守卫通过"
              fi
            else
              echo "  【跳过】runner 上没有 python3"
              SKIPPED="$SKIPPED python3:内联脚本/结构守卫"
            fi

            echo "================ 6/7 Compose 模型 ================"
            if docker compose version >/dev/null 2>&1; then
              cp .env.example .env
              docker compose config >/dev/null
              rm -f .env
              echo "  OK: docker-compose.yml 模型合法"
            else
              echo "  【跳过】runner 上没有 docker compose"
              SKIPPED="$SKIPPED docker-compose"
            fi

            echo "================ 7/7 内置 Caddyfile ================"
            if [ -x ./caddy ]; then
              ./caddy validate --config Caddyfile --adapter caddyfile
              echo "  OK: Caddyfile 合法"
            else
              echo "  【跳过】仓库里没有可执行的 ./caddy"
              SKIPPED="$SKIPPED caddy"
            fi

            echo
            if [ -n "$SKIPPED" ]; then
              echo "⚠️  本次跳过的校验项：$SKIPPED"
              echo "    这些项需要 runner 上有对应工具。想要全量校验，请用 Gitee 主机组把"
              echo "    命令下到 NAS 上跑（NAS 上 gcc/node/python3/docker/caddy 都齐）。"
            fi
            echo "校验结束：已在现场跑过的项全部通过。"
