name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/upgrade.sh
          sh -n scripts/rollback.sh

      - name: Check manager source
        run: gcc -Wall -Wextra -fsyntax-only vaulthub-manager.c

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.S)
          Path('/tmp/vaulthub-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/vaulthub-inline.js

      - name: Validate Compose model
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate bundled Caddyfile
        run: |
          chmod +x ./caddy
          ./caddy validate --config Caddyfile --adapter caddyfile
