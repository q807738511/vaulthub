name: Sync All GHCR vaulthub Tags to Docker Hub
on:
  workflow_dispatch:
  # 镜像构建完成后再同步：直接用 push 触发会和「Build and publish container」并发，
  # 新的 sha-<commit> / latest 标签此时还没推到 GHCR，同步必然把它们记成失败。
  workflow_run:
    workflows: ["Build and publish container"]
    types: [completed]
  # 没有 GitHub API 调度令牌时，可通过仅修改本工作流来安全触发一次；
  # 普通源码提交不会重复执行全量镜像同步。
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-dockerhub-to-ghcr.yml'
  schedule:
    - cron: '0 2 * * *'
concurrency:
  group: sync-all-ghcr-tags-to-dockerhub
  cancel-in-progress: true
jobs:
  sync-all-tags:
    runs-on: ubuntu-latest
    # 构建失败时不要同步半成品镜像。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 安装Skopeo同步工具
        run: sudo apt update && sudo apt install -y skopeo jq
      - name: 登录GHCR源仓库
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u q807738511 --password-stdin
      - name: 登录Docker Hub目标仓库
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: 检测摘要并增量同步镜像标签
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_REPO=docker://ghcr.io/q807738511/vaulthub
          TARGET_REPO=docker://docker.io/q807738511/vaulthub

          # 获取 GHCR 全部标签，并自动选出最高语义版本作为优先同步标签。
          mapfile -t ALL_TAGS < <(
            skopeo list-tags "$SOURCE_REPO" |
              jq -r '.Tags[]' |
              awk 'NF && !seen[$0]++'
          )
          LATEST_TAG=$(
            printf '%s\n' "${ALL_TAGS[@]}" |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )
          if [ -z "$LATEST_TAG" ]; then
            echo "未在 GHCR 找到 vX.Y.Z 格式的版本标签" >&2
            exit 1
          fi

          # 最新版本先同步，其余标签去重后继续增量检查。
          mapfile -t TAGS < <(
            printf '%s\n' "$LATEST_TAG" "${ALL_TAGS[@]}" |
              awk 'NF && !seen[$0]++'
          )
          echo "最新版本：$LATEST_TAG"
          printf '待检查标签：%s\n' "${TAGS[*]}"

          UPDATED=0
          SKIPPED=0
          FAILED_TAGS=()

          # 单个标签的摘要探测必须容错：在 set -e 下直接调用 skopeo inspect，
          # 任何一个历史标签探测失败都会整步中断，最新版本可能因此永远轮不到同步。
          inspect_digest() {
            local ref="$1" attempt digest
            for attempt in 1 2 3; do
              digest=$(skopeo inspect --format '{{.Digest}}' "$ref" 2>/dev/null || true)
              if [ -n "$digest" ]; then
                printf '%s' "$digest"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          for TAG in "${TAGS[@]}"; do
            SOURCE_REF="$SOURCE_REPO:$TAG"
            TARGET_REF="$TARGET_REPO:$TAG"
            echo "::group::检查标签 $TAG"

            if ! SOURCE_DIGEST=$(inspect_digest "$SOURCE_REF"); then
              echo "无法读取 GHCR 标签 $TAG 的摘要，记为失败并继续" >&2
              FAILED_TAGS+=("$TAG")
              echo "::endgroup::"
              continue
            fi
            TARGET_DIGEST=$(skopeo inspect --format '{{.Digest}}' "$TARGET_REF" 2>/dev/null || true)
            echo "GHCR 摘要：${SOURCE_DIGEST}"
            echo "Docker Hub 摘要：${TARGET_DIGEST:-不存在}"

            if [ -n "$TARGET_DIGEST" ] && [ "$SOURCE_DIGEST" = "$TARGET_DIGEST" ]; then
              echo "标签 $TAG 内容未变化，跳过推送"
              SKIPPED=$((SKIPPED + 1))
              echo "::endgroup::"
              continue
            fi

            SYNCED=0
            for ATTEMPT in 1 2 3; do
              echo "第 $ATTEMPT 次同步标签 $TAG"
              if skopeo copy --all --preserve-digests "$SOURCE_REF" "$TARGET_REF"; then
                # 写入后必须从目标仓库读回并核对摘要，不能只依赖 copy 的退出码。
                READBACK_DIGEST=$(skopeo inspect --format '{{.Digest}}' "$TARGET_REF" 2>/dev/null || true)
                if [ "$READBACK_DIGEST" = "$SOURCE_DIGEST" ]; then
                  echo "标签 $TAG 同步并读回校验成功：$READBACK_DIGEST"
                  SYNCED=1
                  UPDATED=$((UPDATED + 1))
                  break
                fi
                echo "标签 $TAG 读回摘要不一致：${READBACK_DIGEST:-不存在}" >&2
              fi
              sleep 10
            done

            if [ "$SYNCED" -ne 1 ]; then
              FAILED_TAGS+=("$TAG")
              echo "标签 $TAG 连续 3 次同步或读回校验失败" >&2
            fi
            echo "::endgroup::"
          done

          {
            echo "## GHCR → Docker Hub 增量同步"
            echo "- 最新版本：\`$LATEST_TAG\`"
            echo "- 已更新：$UPDATED"
            echo "- 未变化并跳过：$SKIPPED"
            echo "- 失败：${#FAILED_TAGS[@]}"
            if [ "${#FAILED_TAGS[@]}" -gt 0 ]; then
              echo "- 失败标签：\`${FAILED_TAGS[*]}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 最新版本必须成功；历史标签失败也保留红灯，避免静默漏同步。
          if printf '%s\n' "${FAILED_TAGS[@]:-}" | grep -Fxq "$LATEST_TAG"; then
            echo "最新版本 $LATEST_TAG 未同步成功" >&2
            exit 1
          fi
          test "${#FAILED_TAGS[@]}" -eq 0
          echo "所有标签增量同步检查完成"
