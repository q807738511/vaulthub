name: Sync All GHCR vaulthub Tags to Docker Hub
on:
  workflow_dispatch:
  # 没有 GitHub API 调度令牌时，可通过仅修改本工作流来安全触发一次；
  # 普通源码提交不会重复执行全量镜像同步。
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-dockerhub-to-ghcr.yml'
  schedule:
    - cron: '0 2 * * *'
concurrency:
  group: sync-all-ghcr-tags-to-dockerhub
  cancel-in-progress: true
jobs:
  sync-all-tags:
    runs-on: ubuntu-latest
    steps:
      - name: 安装Skopeo同步工具
        run: sudo apt update && sudo apt install -y skopeo jq
      - name: 登录GHCR源仓库
        run: skopeo login ghcr.io -u q807738511 -p ${{ secrets.GH_TOKEN }}
      - name: 登录Docker Hub目标仓库
        run: skopeo login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 全量同步所有镜像标签
        run: |
          # 获取ghcr.io上所有vaulthub镜像标签
          TAGS=$(skopeo inspect docker://ghcr.io/q807738511/vaulthub | jq -r '.RepoTags[]')
          # 当前稳定版优先，保证全量历史标签同步耗时较长时，新版本也能先交付。
          PRIORITY_TAG=v0.9.2
          TAGS=$(printf '%s\n%s\n' "$PRIORITY_TAG" "$TAGS" | awk 'NF && !seen[$0]++')
          echo "待同步标签列表：$TAGS"
          # 遍历所有标签执行同步，每个标签最多重试3次
          FAILED=0
          for TAG in $TAGS; do
            echo "开始同步标签：$TAG"
            SYNCED=0
            for i in {1..3}; do
              if skopeo copy --all \
                docker://ghcr.io/q807738511/vaulthub:$TAG \
                docker://docker.io/q807738511/vaulthub:$TAG; then
                echo "标签 $TAG 同步成功"
                SYNCED=1
                break
              fi
              sleep 10
            done
            if [ "$SYNCED" -ne 1 ]; then
              echo "标签 $TAG 连续 3 次同步失败" >&2
              FAILED=1
            fi
          done
          test "$FAILED" -eq 0
          echo "所有标签同步流程执行完成"
