services:
  vaulthub:
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always
    ports:
      - "8088:8088"
    environment:
      # 公网部署建议改为长随机令牌；留空表示不启用管理接口鉴权。
      ADMIN_TOKEN: ""
    volumes:
      - ./data:/data
      - /media:/media:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped