services:
  vaulthub:
    # v0.9.42：镜像跟随 GHCR 可写标签 latest —— 每次正式版本发布（tag vX.Y.Z）会
    # 同时更新 vX.Y.Z 与 latest 指向同一 digest；日常升级无需再改本文件：
    #   docker compose pull && docker compose up -d --force-recreate
    # 需要锁定/回滚到具体版本时，把下面改成 ghcr.io/q807738511/vaulthub:v0.9.41 即可。
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always

    # 将 NVIDIA GPU 交给容器；宿主机需安装 NVIDIA Container Toolkit。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    ports:
      - "8088:8088"

    # v0.9.42：env 文件变为「可选覆盖层」——全部默认值已内置进镜像
    # （Dockerfile ENV 与 vaulthub.env 模板逐键对齐），文件缺失/过期都不影响启动；
    # 需要覆盖默认值时才放本文件（可配合 scripts/merge-env.sh 补齐新键）。
    env_file:
      - path: ./vaulthub.env
        required: false

    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - TMDB_API_KEY=
      - MEDIA_SCRAPER_MODE=auto
      - SYSTEM_MONITOR_FILESYSTEMS=vol1,vol2,vol3

    volumes:
      - ./data:/data
      - /media:/media:ro
      - /vol3/1000/监控/date:/data/transcode-cache
      - /vol3/1000/komga/音乐:/yy:ro
      - /vol3/1000/komga/漫画/mh:/mh:ro
      - /vol3/1000/komga/BOOK:/txt:ro
      - /vol4/1000/AMO:/AMO:ro
      - /vol2/1000/ATV:/ATV:ro

      # Docker 状态监控
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 系统监控
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /vol1:/host/vol1:ro
      - /vol2:/host/vol2:ro
      - /vol3:/host/vol3:ro

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
