services:
  vaulthub:
    # v0.9.42：镜像跟随 GHCR 可写标签 latest —— 每次正式版本发布（tag vX.Y.Z）会
    # 同时更新 vX.Y.Z 与 latest 指向同一 digest；日常升级无需再改本文件：
    #   docker compose pull && docker compose up -d --force-recreate
    # 需要锁定/回滚到具体版本时，把下面改成 ghcr.io/q807738511/vaulthub:v0.9.41 即可。
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always

    # 将 NVIDIA GPU 交给容器；宿主机需安装 NVIDIA Container Toolkit。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    ports:
      - "8088:8088"

    # v0.9.42：env 文件变为「可选覆盖层」——全部默认值已内置进镜像
    # （Dockerfile ENV 与 vaulthub.env 模板逐键对齐），文件缺失/过期都不影响启动；
    # 需要覆盖默认值时才放本文件（可配合 scripts/merge-env.sh 补齐新键）。
    env_file:
      - path: ./vaulthub.env
        required: false

    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - TMDB_API_KEY=
      - MEDIA_SCRAPER_MODE=auto
      # 系统监控的卷名列表（逗号分隔），与下方 /host/<卷名> 只读挂载一一对应；
      # 只需监控一个卷时填单个卷名即可（示例：vh-data）。
      - SYSTEM_MONITOR_FILESYSTEMS=vh-data

    volumes:
      # 应用数据：运行时配置、阅读进度、转码缓存等持久化目录
      - ./data:/data
      # 媒体库映射（示例）：冒号左侧是本机路径，右侧是容器内路径。
      # 请按自己的目录结构增删 —— 电影/剧集/音乐/漫画/书籍/文档都挂进容器即可，
      # 然后在 Web 界面「媒体库」里登记这些容器内路径（:ro 表示只读）。
      - /srv/media/films:/media/films:ro
      - /srv/media/series:/media/series:ro
      - /srv/media/music:/yy:ro
      - /srv/media/comics:/mh:ro
      - /srv/media/books:/txt:ro

      # Docker 状态监控（容器页面/刮削辅助需要）
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 系统监控：/proc 与 /sys 为必需只读挂载。
      # 卷监控：把要监控的卷根目录挂到 /host/<卷名>:ro 并同步修改上面的
      # SYSTEM_MONITOR_FILESYSTEMS，例如：
      #   - /mnt/vh-data:/host/vh-data:ro
      #   - /mnt/vh-media:/host/vh-media:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /srv:/host/vh-data:ro

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
