services:
  vaulthub:
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always
    ports:
      - "8088:8088"
    environment:
      ADMIN_TOKEN: "请设置管理令牌"
    volumes:
      - ./data:/data
      - /media:/media:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped