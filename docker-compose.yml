services:
  vaulthub:
    image: ghcr.io/q807738511/vaulthub:latest
    container_name: VaultHub
    pull_policy: always
    ports:
      - "8088:8088"
    environment:
      # 管理接口令牌；留空表示不启用鉴权。
      ADMIN_TOKEN: ""
      # 内置 NAS 监控开关，不需要 Glances 容器。
      SYSTEM_MONITOR_ENABLED: "true"
      # 采样间隔示例，当前接口按请求即时读取。
      SYSTEM_MONITOR_INTERVAL: "5"
      # 网卡名称；留空时由后端使用默认网卡策略。
      SYSTEM_MONITOR_INTERFACE: ""
      # 容器内要显示容量的卷，逗号分隔；也可直接填容器内绝对路径。
      SYSTEM_MONITOR_FILESYSTEMS: "vol1,vol2,vol3"
      # 宿主机系统信息在容器内的只读路径。
      SYSTEM_MONITOR_PROC_ROOT: "/host/proc"
      SYSTEM_MONITOR_SYS_ROOT: "/host/sys"
      # 可选：配置后影视本地库启用 TMDB 刮削；未配置时默认豆瓣/文件名兜底。
      TMDB_API_KEY: ""
      # Go 字幕服务无需 Python/额外容器；默认自动扫描视频同目录字幕。
      MEDIA_ROOT: "/media"
      # 在线 provider 预留标准 JSON 适配端点；留空时仅使用本地字幕。
      SUBTITLE_SHOOTER_ENDPOINT: ""
      SUBTITLE_ZIMUKU_BASE: ""
      SUBTITLE_SUBHD_BASE: ""
      # 硬件转码：auto 会优先尝试 NVIDIA CUDA，其次 VAAPI/QSV，失败自动回退 CPU。
      FFMPEG_HWACCEL: "${FFMPEG_HWACCEL:-auto}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      # NVIDIA 宿主机安装 nvidia-container-toolkit 后取消注释 deploy.devices。
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}"
    # NVIDIA 宿主机安装 nvidia-container-toolkit 后，可在 .env 设置 VAULTHUB_GPUS=all。
    # gpus: "${VAULTHUB_GPUS:-all}"
    # GPU 主机启用 VAAPI/QSV 时取消注释；默认不映射不存在的设备，保证 CPU 主机可启动。
    # devices:
    #   - "${VAULTHUB_DRI_DEVICE:-/dev/dri:/dev/dri}"
    volumes:
      - ./data:/data
      # 启用本机容器扫描；Docker socket 权限等同主机 Docker 管理权限，仅限可信环境。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 媒体目录：按实际宿主机目录修改，保持只读。
      - /media:/media:ro
      # 内置监控所需的少量只读系统信息。
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # 仅监控这里列出的卷容量，不会递归扫描文件。
      - /vol1:/host/vol1:ro
      - /vol2:/host/vol2:ro
      - /vol3:/host/vol3:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped