services:
  vaulthub:
    image: ghcr.nju.edu.cn/q807738511/vaulthub:v0.8.8
    container_name: VaultHub
    pull_policy: always

    # 将 NVIDIA GPU 交给容器；宿主机需安装 NVIDIA Container Toolkit。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    ports:
      - "8088:8088"

    env_file:
      - ./vaulthub.env

    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - TMDB_API_KEY=
      - MEDIA_SCRAPER_MODE=auto
      - SYSTEM_MONITOR_FILESYSTEMS=vol1,vol2,vol3

    volumes:
      - ./data:/data
      - /media:/media:ro
      - /vol3/1000/监控/date:/data/transcode-cache
      - /vol3/1000/komga/音乐:/yy:ro
      - /vol3/1000/komga/漫画/mh:/mh:ro
      - /vol3/1000/komga/BOOK:/txt:ro
      - /vol4/1000/AMO:/AMO:ro
      - /vol2/1000/ATV:/ATV:ro

      # Docker 状态监控
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # 系统监控
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /vol1:/host/vol1:ro
      - /vol2:/host/vol2:ro
      - /vol3:/host/vol3:ro

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
