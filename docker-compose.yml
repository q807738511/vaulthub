services:
  vaulthub:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    image: vaulthub:0.5.0-local
    container_name: VaultHub
    ports:
      - "${WEBUI_PORT:-8088}:8088"
    environment:
      NAS_IP: "${NAS_IP:-192.168.112.3}"
      DASHBOARD_ORIGIN: "${DASHBOARD_ORIGIN:-https://home.enged.top}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      WEB_ROOT: /srv
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./data:/data
    read_only: false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
